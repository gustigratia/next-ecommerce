name: CD - Build and Deploy to Vercel

on:
  push:
    branches: [master]

jobs:
  build-and-deploy:
    name: Build, Lint, and Deploy
    runs-on: ubuntu-latest

    steps:
      # ─── 1. Checkout Source Code ─────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ─── 2. Setup Node.js ────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # ─── 3. Install Dependencies ─────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ─── 4. Lint Check ───────────────────────────────────────────────────
      - name: Lint with ESLint
        run: npm run lint

      # ─── 5. Build Project ────────────────────────────────────────────────
      # Dummy env vars for build-time (not used in production).
      # Real values are managed via Vercel Environment Variables settings.
      - name: Build project
        run: npm run build
        env:
          # MongoDB
          MONGODB_URI: ${{ secrets.MONGODB_URI }}

          # Firebase (Public keys — safe for NEXT_PUBLIC_)
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}

      # ─── 6. Install Vercel CLI ───────────────────────────────────────────
      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # ─── 7. Pull Vercel Environment & Project Info ───────────────────────
      - name: Pull Vercel environment information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      # ─── 8. Build via Vercel (generates .vercel/output) ─────────────────
      - name: Build project artifacts (Vercel)
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      # ─── 9. Deploy to Vercel Production ─────────────────────────────────
      - name: Deploy to Vercel Production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}